<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-work — ivanAdiaz</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f6b4f">
<link rel="icon" type="image/png" href="/favicon.png">
<style>html.site-gate-pending body{visibility:hidden}</style>
<script src="/private/site-gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/co-work/cowrite.css">
</head>
<body>
<nav class="topnav" aria-label="Site">
  <a class="nav-brand" href="/co-work/">Co-work</a>
  <div class="nav-links">
    <a href="/console-os/">Console</a>
    <a href="/co-work/" aria-current="page">Co-work</a>
  </div>
</nav>

<div class="app">
  <aside class="sidebar" aria-label="Threads">
    <button type="button" class="btn btn-primary" id="new-thread">New thread</button>
    <ul class="thread-list" id="thread-list"></ul>
    <div class="sidebar-foot">
      <p class="fine">Threads are kept in this browser only. Back them up to move or keep them.</p>
      <div class="row">
        <button type="button" class="btn btn-quiet" id="backup">Back up all</button>
        <button type="button" class="btn btn-quiet" id="restore">Restore</button>
        <input type="file" id="restore-file" accept="application/json,.json" hidden>
      </div>
    </div>
  </aside>

  <main class="thread">
    <header class="thread-head">
      <input type="text" id="thread-title" class="thread-title" placeholder="Untitled thread" aria-label="Thread title" maxlength="120">
      <div class="row">
        <button type="button" class="btn btn-quiet" id="download">Download</button>
        <button type="button" class="btn btn-quiet btn-danger" id="delete-thread">Delete thread</button>
      </div>
    </header>

    <div class="banner hidden" id="banner" role="alert">
      <span id="banner-text"></span>
      <button type="button" class="banner-close" id="banner-close" aria-label="Dismiss">×</button>
    </div>

    <ol class="messages" id="messages" aria-live="polite"></ol>

    <form class="composer" id="composer">
      <label class="sr-only" for="draft">Your message</label>
      <textarea id="draft" rows="4" placeholder="Paste or write your text. Then choose who answers."></textarea>
      <div class="asks">
        <div class="ask ask-gpt">
          <label class="sr-only" for="model-gpt">GPT model</label>
          <select id="model-gpt" class="model"></select>
          <button type="button" class="btn btn-ask" id="ask-gpt">Ask GPT</button>
        </div>
        <div class="ask ask-claude">
          <label class="sr-only" for="model-claude">Claude model</label>
          <select id="model-claude" class="model"></select>
          <button type="button" class="btn btn-ask" id="ask-claude">Ask Claude</button>
        </div>
        <button type="button" class="btn btn-stop hidden" id="stop">Stop</button>
      </div>
      <p class="fine">Your text joins the thread, then the one you ask replies with the whole thread in view. Leave the box empty to ask for a reply to what is already there.</p>
    </form>
  </main>
</div>

<script src="/config/private-api-config.js"></script>
<script src="/co-work/cowrite.js"></script>
</body>
</html>
