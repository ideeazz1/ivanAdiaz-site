<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#18211d">
  <title>Ivan OS — Automation Registry</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/console-os/console.css">
  <script src="/private/site-gate.js"></script>
  <script src="/config/private-api-config.js"></script>
  <script defer src="/console-os/console.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/console-os/" aria-label="Ivan OS home">
        <span class="brand-mark" aria-hidden="true">IO</span>
        <span>
          <strong>Ivan OS</strong>
          <small>Private console</small>
        </span>
      </a>
      <button class="logout" id="logout-button" type="button">Log out</button>
    </header>

    <main>
      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">Shared Ivan OS</h1>
        </div>
        <p class="as-of" id="as-of">Today</p>
      </section>

<section class="registry-section" aria-labelledby="ivan-os-title">
        <div class="section-heading">
          <div>
            <h2 id="ivan-os-title">Automation cycle</h2>
          </div>
          <span class="section-count" id="section-count">Loading…</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Automation</th>
                <th scope="col">Role</th>
                <th scope="col">Where</th>
                <th scope="col">Schedule</th>
                <th scope="col">Ran?</th>
                <th scope="col">Result</th>
                <th scope="col">What happened?</th>
                <th scope="col">Ivan?</th>
              </tr>
            </thead>
            <tbody id="registry-body">
              <tr class="empty-row">
                <td colspan="8">
                  <strong>Loading…</strong>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
