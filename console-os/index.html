<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#172033">
  <title>Ivan OS — Automation Registry</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/console-os/console.css">
  <script src="/config/private-api-config.js"></script>
  <script src="/private/site-gate.js"></script>
  <script defer src="/console-os/console.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/console-os/" aria-label="Ivan OS automation registry">
        <span class="brand-mark" aria-hidden="true">IO</span>
        <span>
          <strong>Ivan OS</strong>
          <small>Automation registry</small>
        </span>
      </a>
      <button class="logout" id="logout-button" type="button">Log out</button>
    </header>

    <main>
      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Read-only automation proof</p>
          <h1 id="page-title">Automation Registry</h1>
          <p class="intro">The registry defines what exists. Each row shows the latest registered proof without changing anything.</p>
        </div>
        <p class="as-of" id="as-of">Loading…</p>
      </section>

      <section class="source-strip" aria-label="Registry source">
        <div>
          <span class="source-label">Source</span>
          <strong id="source-name">ivan-cos / registry / automations.json</strong>
        </div>
        <div class="source-meta">
          <span id="source-state">Loading registered proof…</span>
          <span id="source-sha"></span>
        </div>
      </section>

      <div id="console-status" class="status-card" role="status">
        Loading automation registry…
      </div>

      <div id="lane-container" class="lane-stack" hidden></div>
    </main>
  </div>
</body>
</html>
