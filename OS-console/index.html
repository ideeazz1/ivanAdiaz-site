<!DOCTYPE html>
<html lang="en">
<head>
<script defer src="/config/plausible.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f6b4f">
<meta http-equiv="refresh" content="0; url=https://database2-api-114691787160.us-west1.run.app/OS-console">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Opening OS Console — Ivan Diaz</title>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #5a665e;
    --paper: #f4f6f3;
    --surface: rgba(255, 255, 255, 0.82);
    --line: rgba(31, 42, 36, 0.12);
    --sage: #2f6b4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse 80% 50% at 10% 0%, rgba(47, 107, 79, 0.14), transparent 60%),
      linear-gradient(165deg, #fbfcfb 0%, #eef2ee 48%, var(--paper) 100%);
  }
  main {
    width: min(560px, 100%);
    padding: 28px;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .eyebrow {
    margin: 0 0 10px;
    color: var(--sage);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    line-height: 1.08;
    letter-spacing: -0.04em;
  }
  p { color: var(--muted); line-height: 1.55; }
  a {
    color: var(--sage);
    font-weight: 700;
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Private OS Console</p>
    <h1>Opening the authenticated console.</h1>
    <p>
      If you are not redirected automatically, open the secure console:
      <a href="https://database2-api-114691787160.us-west1.run.app/OS-console">Launch OS Console</a>.
    </p>
  </main>
</body>
</html>
