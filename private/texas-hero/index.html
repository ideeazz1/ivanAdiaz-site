<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#081028">
<title>Texas — Private Preview</title>
<style>
  :root {
    color-scheme: dark;
    --navy: #081028;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--navy);
    overflow: hidden;
  }
  body {
    position: fixed;
    inset: 0;
  }

  .stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--navy);
  }

  .tx-visual {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 44%;
    filter: saturate(1.04) contrast(1.02) brightness(0.97);
  }

  @media (max-width: 1024px) {
    .tx-visual { object-position: 50% 46%; }
  }

  @media (max-width: 720px) {
    .tx-visual { object-position: 50% 50%; }
  }
</style>
</head>
<body>
<div class="stage">
  <video
    class="tx-visual"
    src="/assets/texas/texas-hero-web.mp4"
    poster="/assets/texas/texas-hero-poster.jpg"
    autoplay
    loop
    muted
    playsinline
    disablepictureinpicture
    preload="auto"
    tabindex="-1"
    aria-hidden="true"
  ></video>
</div>
</body>
</html>
