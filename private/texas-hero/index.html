 50% 50%,rgba(8,16,40,0) 52%,rgba(8,16,40,.06) 61.6%,rgba(8,16,40,.18) 70.2%,rgba(8,16,40,.36) 78.4%,rgba(8,16,40,.58) 86.6%,rgba(8,16,40,.8) 93.8%,#081028 100%),linear-gradient(to top,#081028 0%,rgba(8,16,40,0) 14%),linear-gradient(to bottom,#081028 0%,rgba(8,16,40,0) 14%),linear-gradient(to left,#081028 0%,rgba(8,16,40,0) 14%),linear-gradient(to right,#081028 0%,rgba(8,16,40,0) 14%)}@media(max-width:720px){.shell{width:min(100% - 28px,640px)}.hero{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:0;min-height:100svh;padding:76px 0 16px}.copy{gap:14px;width:94%}.title{font-size:clamp(42px,13.4vw,56px)}.title span:nth-child(2){margin-left:8%}.title span:nth-child(3){margin-left:15%}.guidance{font-size:.98rem;line-height:1.6}.visual{width:56%;margin:12px auto 0}}</style></head><body><main class="shell"><section class="hero"><div class="copy"><h1 class="title"><span>Texan&apos;s Guide</span><span>to 100%</span><span>Financing</span></h1><div class="guidance"><span>Start with the programs.</span><span>Compare the numbers.</span><span>Choose the path that fits.</span></div><div class="cta">Apply Today</div></div><div class="visual"><video src="/assets/texas/texas-hero-web.mp4" poster="/assets/texas/texas-hero-poster.jpg" autoplay loop muted playsinline preload="auto"></video></div></section></main></body></html>
