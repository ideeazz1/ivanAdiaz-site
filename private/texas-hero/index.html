<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#081028">
<title>Texas Hero Preview — Ivan Diaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --tx-navy: #081028;
    --tx-navy-rgb: 8, 16, 40;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--tx-navy); }
  body { min-height: 100vh; overflow-x: hidden; color: #fff; font-family: Inter, system-ui, sans-serif; }
  [hidden] { display: none !important; }

  .auth-gate {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--tx-navy);
  }
  .auth-card {
    width: min(360px, 100%);
    padding: 28px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    background: rgba(255,255,255,.05);
    box-shadow: 0 24px 80px rgba(0,0,0,.28);
  }
  .auth-card h1 { margin: 0 0 8px; font: 700 1.35rem/1.15 Outfit, Inter, sans-serif; }
  .auth-card p { margin: 0 0 20px; color: rgba(255,255,255,.58); font-size: .9rem; line-height: 1.5; }
  .auth-card label { display: block; margin: 12px 0 6px; color: rgba(255,255,255,.72); font-size: .78rem; font-weight: 600; }
  .auth-card input {
    width: 100%; padding: 12px 13px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07);
    color: #fff; font: inherit; outline: none;
  }
  .auth-card input:focus { border-color: rgba(255,255,255,.42); }
  .auth-card button {
    width: 100%; margin-top: 18px; padding: 12px 16px; border: 0; border-radius: 9px;
    background: #fff; color: #081028; font: 700 .9rem Inter, sans-serif; cursor: pointer;
  }
  .auth-error { min-height: 18px; margin-top: 10px !important; color: #ffb4b4 !important; }

  .preview-shell {
    width: min(1180px, calc(100% - 48px));
    margin: 0 auto;
  }

  .texas-hero {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr);
    align-items: center;
    gap: clamp(24px, 4vw, 68px);
    min-height: clamp(620px, 76vh, 840px);
    padding: clamp(86px, 9vw, 126px) 0 clamp(58px, 7vw, 92px);
    position: relative;
  }

  .texas-hero__copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(18px, 2vw, 26px);
    min-width: 0;
    z-index: 2;
  }

  .texas-hero__visual {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
    min-width: 0;
    z-index: 1;
    line-height: 0;
    --tx-fade-edge:
      rgba(var(--tx-navy-rgb), 1) 0%,
      rgba(var(--tx-navy-rgb), 1) 1.4%,
      rgba(var(--tx-navy-rgb), .96) 2.8%,
      rgba(var(--tx-navy-rgb), .87) 4.2%,
      rgba(var(--tx-navy-rgb), .74) 5.6%,
      rgba(var(--tx-navy-rgb), .58) 7%,
      rgba(var(--tx-navy-rgb), .42) 8.7%,
      rgba(var(--tx-navy-rgb), .26) 10.4%,
      rgba(var(--tx-navy-rgb), .13) 11.9%,
      rgba(var(--tx-navy-rgb), .04) 13.2%,
      rgba(var(--tx-navy-rgb), 0) 14%;
  }

  .texas-hero__video {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    background-color: var(--tx-navy);
  }

  .texas-hero__visual::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: 0 0 0 2px var(--tx-navy);
    background:
      radial-gradient(ellipse farthest-side at 50% 50%,
        rgba(var(--tx-navy-rgb), 0) 52%,
        rgba(var(--tx-navy-rgb), .06) 61.6%,
        rgba(var(--tx-navy-rgb), .18) 70.2%,
        rgba(var(--tx-navy-rgb), .36) 78.4%,
        rgba(var(--tx-navy-rgb), .58) 86.6%,
        rgba(var(--tx-navy-rgb), .80) 93.8%,
        rgba(var(--tx-navy-rgb), 1) 100%),
      linear-gradient(to top, var(--tx-fade-edge)),
      linear-gradient(to bottom, var(--tx-fade-edge)),
      linear-gradient(to left, var(--tx-fade-edge)),
      linear-gradient(to right, var(--tx-fade-edge));
  }

  .hero-title-flag {
    margin: 0;
    font-family: Outfit, Inter, system-ui, sans-serif;
    font-size: clamp(54px, 6.2vw, 76px);
    font-weight: 800;
    line-height: .95;
    letter-spacing: -.055em;
    color: #fff;
    text-shadow: 0 0 9px rgba(255,255,255,.28), 0 0 26px rgba(138,176,255,.24), 0 0 52px rgba(77,126,231,.14);
  }
  .hero-title-flag .hero-line { display: block; width: max-content; max-width: 100%; white-space: nowrap; }
  .hero-title-flag .hero-line:nth-child(2) { margin-left: 9%; }
  .hero-title-flag .hero-line:nth-child(3) { margin-left: 18%; }
  .hero-title-flag .hero-line + .hero-line { margin-top: .035em; }

  .hero-guidance {
    width: min(640px, 94%);
    margin: 0;
    color: rgba(255,255,255,.62);
    font-family: Outfit, Inter, system-ui, sans-serif;
    font-size: clamp(1rem, 1.45vw, 1.15rem);
    font-weight: 500;
    line-height: 1.48;
    letter-spacing: -.01em;
    text-align: left;
  }
  .hero-guidance span { display: block; }

  .hero-apply { display: flex; margin-top: 4px; }
  .hero-apply a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 14px 36px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.14);
    background: linear-gradient(135deg, #5b68f5 0%, #4f5de8 55%, #4652df 100%);
    color: #fff; text-decoration: none; font-size: 14px; font-weight: 600;
    box-shadow: 0 0 28px rgba(100,150,230,.24), 0 8px 22px rgba(79,93,232,.32), inset 0 1px 0 rgba(255,255,255,.12);
  }

  @media (max-width: 720px) {
    .preview-shell { width: min(100% - 28px, 640px); }
    .texas-hero {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 0;
      min-height: auto;
      padding: 80px 0 8px;
      overflow: visible;
    }
    .texas-hero__copy { position: relative; z-index: 3; gap: 14px; width: 88%; }
    .texas-hero__visual { position: relative; z-index: 1; width: 58%; margin: 16px auto 0; pointer-events: none; }
    .hero-title-flag { font-size: clamp(44px, 12.7vw, 61px); line-height: .96; }
    .hero-title-flag .hero-line:nth-child(2) { margin-left: 8%; }
    .hero-title-flag .hero-line:nth-child(3) { margin-left: 15%; position: relative; z-index: 2; }
    .hero-guidance { width: 100%; font-size: 1rem; line-height: 1.6; color: rgba(255,255,255,.66); }
    .hero-apply { margin-top: 8px; }
  }
  @media (max-width: 430px) {
    .texas-hero { padding: 76px 0 8px; }
    .texas-hero__copy { width: 94%; }
    .hero-title-flag { font-size: clamp(42px, 13.4vw, 56px); }
    .texas-hero__visual { width: 56%; margin-top: 12px; }
    .hero-guidance { font-size: .98rem; }
  }
</style>
</head>
<body>
<section class="auth-gate" id="auth-gate">
  <form class="auth-card" id="auth-form">
    <h1>Private preview</h1>
    <p>Use your existing private-site credentials to view the Texas hero prototype.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="auth-submit" type="submit">Continue</button>
    <p class="auth-error" id="auth-error" role="alert"></p>
  </form>
</section>

<main class="preview-shell" id="preview" hidden>
  <section class="texas-hero" aria-labelledby="texas-guide-title">
    <div class="texas-hero__copy">
      <h1 class="hero-title-flag" id="texas-guide-title">
        <span class="hero-line">Texan&apos;s Guide</span>
        <span class="hero-line">to 100%</span>
        <span class="hero-line">Financing</span>
      </h1>
      <div class="hero-guidance" aria-label="Texas financing approach">
        <span>Start with the programs.</span>
        <span>Compare the numbers.</span>
        <span>Choose the path that fits.</span>
      </div>
      <div class="hero-apply">
        <a href="https://assurancemortgage.com/assurance_officers/ivan-diaz/" target="_blank" rel="noopener noreferrer">Apply Today</a>
      </div>
    </div>
    <div class="texas-hero__visual" aria-hidden="true">
      <video class="texas-hero__video" src="/assets/texas/texas-hero-web.mp4" poster="/assets/texas/texas-hero-poster.jpg" autoplay loop muted playsinline preload="auto" disablepictureinpicture tabindex="-1"></video>
    </div>
  </section>
</main>

<script>
(function () {
  var TOKEN_KEY = 'ivan-site-gate-token';
  var API_BASE = 'https://homebotintel-114691787160.us-south1.run.app/api/database2';
  var gate = document.getElementById('auth-gate');
  var preview = document.getElementById('preview');
  var form = document.getElementById('auth-form');
  var error = document.getElementById('auth-error');
  var submit = document.getElementById('auth-submit');

  function token() {
    try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (_) { return ''; }
  }
  function showPreview() {
    gate.hidden = true;
    preview.hidden = false;
  }
  if (token()) { showPreview(); return; }

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    error.textContent = '';
    submit.disabled = true;
    try {
      var res = await fetch(API_BASE + '/site-gate/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || data.status !== 'ok' || !data.token) throw new Error(data.message || 'Sign-in failed');
      try { sessionStorage.setItem(TOKEN_KEY, data.token); } catch (_) {}
      showPreview();
    } catch (err) {
      error.textContent = err.message || 'Sign-in failed';
      submit.disabled = false;
    }
  });
})();
</script>
</body>
</html>
